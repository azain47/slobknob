name: build

# Every push / PR: tests, clippy and installers (as run artifacts).
# A tag like v0.2.0: the same, plus a draft GitHub Release with the installers.
# Bump "version" in app/src-tauri/tauri.conf.json to match before tagging.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p knob-core

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Apple Silicon and Intel in one .app
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - os: windows-latest
            rust-targets: ""
            tauri-args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the draft release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Builds the installers; on a tag also uploads them to a draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.tauri-args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: SlobKnob ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds.
            macOS: open the .dmg, drag SlobKnob to Applications, then right-click it > Open the first time.
            Windows: run the -setup.exe; if SmartScreen says "Windows protected your PC", click More info > Run anyway.
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: slobknob-${{ matrix.os }}
          path: |
            app/target/**/release/bundle/dmg/*.dmg
            app/target/**/release/bundle/nsis/*.exe
            app/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
